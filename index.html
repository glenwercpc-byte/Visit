<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시카고 언약장로교회 교인 심방 일지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --ink: #1e293b;
  --ink-strong: #0f172a;
  --muted: #64748b;
  --line: #cbd5e1;
  --line-soft: #e2e8f0;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: #eef2ff;
  --accent-line: #c7d2fe;
  --edit: #92400e;
  --edit-soft: #fffbeb;
  --edit-line: #fcd34d;
  --danger: #dc2626;
  --danger-line: #fca5a5;
  --ok: #059669;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 16px 12px 56px; }

/* 헤더 */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink-strong); }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; font-weight: 500; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 0.75rem; font-weight: 700;
  padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--line-soft); background: var(--surface); color: var(--muted); cursor: pointer;
}
.chip:hover { border-color: var(--line); color: var(--ink); }

/* 카드 */
.card { background: var(--surface); border-radius: 14px; box-shadow: 0 1px 3px rgb(15 23 42 / 0.08); }

/* 공통 입력 */
.field {
  width: 100%; height: 42px; padding: 0 12px;
  font: inherit; font-size: 0.95rem; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 9px;
  transition: border-color .15s, box-shadow .15s;
}
textarea.field { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.6; }
select.field { padding-right: 32px; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgb(79 70 229 / 0.15); }

/* 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 42px; padding: 0 16px;
  font: inherit; font-size: 0.9rem; font-weight: 700;
  border-radius: 9px; border: 1.5px solid transparent; cursor: pointer;
  white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:focus-visible, .chip:focus-visible, .icon-btn:focus-visible, .rec:focus-visible, .view-toggle button:focus-visible {
  outline: 3px solid var(--accent-line); outline-offset: 2px;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { background: #f8fafc; }
.btn-danger { background: var(--surface); border-color: var(--danger-line); color: var(--danger); }
.btn-small { height: 32px; padding: 0 12px; font-size: 0.8rem; }
.icon-btn { border: 0; background: transparent; padding: 6px; border-radius: 999px; cursor: pointer; color: var(--muted); display: inline-flex; }
.icon-btn:hover { background: var(--line-soft); }

/* 툴바 */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; border-bottom: 1px solid var(--line-soft); }
.search { position: relative; flex: 1 1 280px; display: flex; gap: 8px; }
.search .field { padding-left: 38px; }
.search svg { z-index: 1; }
.search > svg { position: absolute; left: 12px; top: 13px; width: 16px; height: 16px; color: #94a3b8; pointer-events: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 auto; }
#save-btn { min-width: 128px; }

/* 조회 입력 칸: 클릭하면 눈에 띄게 강조 */
#search-name, #range-year { transition: border-color .15s, box-shadow .15s, background-color .15s; }
#search-name:focus, #range-year:focus {
  border-color: var(--accent);
  border-width: 2px;
  background-color: #fefce8;
  box-shadow: 0 0 0 4px rgb(79 70 229 / 0.25);
}
#search-name:focus::placeholder { color: #a16207; }

/* 검색 결과 줄 */
.found { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); background: #fafbff; font-size: 0.9rem; }
.found strong { color: var(--ink-strong); font-size: 1.05rem; }
.found .muted { color: var(--muted); }
.found .err { color: var(--danger); font-weight: 700; }
.found-actions { display: flex; gap: 6px; }

/* 폼 */
form { padding: 18px 16px 20px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 18px; }
.c2 { grid-column: span 2; }
.c3 { grid-column: span 3; }
.c4 { grid-column: span 4; }
.full { grid-column: 1 / -1; }
.lbl { display: block; font-size: 0.8rem; font-weight: 800; color: #334155; margin-bottom: 5px; }
.lbl .req { color: var(--danger); margin-left: 2px; }
.time-row { display: flex; align-items: center; gap: 8px; }
.time-row span { color: #94a3b8; font-weight: 700; }

/* 모달 */
.modal { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgb(15 23 42 / 0.55); }
.modal-box { width: 100%; max-width: 680px; max-height: 84vh; display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 48px rgb(15 23 42 / 0.25); }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); background: #f8fafc; }
.modal-head h3 { margin: 0; font-size: 1rem; font-weight: 800; color: var(--ink-strong); }
.modal-head p { margin: 2px 0 0; font-size: 0.8rem; color: var(--accent); font-weight: 600; }
.range { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.range label { font-size: 0.85rem; font-weight: 800; color: #334155; }
.range select { width: 130px; height: 38px; font-size: 0.9rem; }
.view-toggle { display: inline-flex; flex-shrink: 0; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; margin-left: auto; }
.view-toggle button { font: inherit; font-size: 0.85rem; font-weight: 700; border: 0; background: var(--surface); color: var(--muted); padding: 0 16px; height: 38px; min-width: 72px; cursor: pointer; white-space: nowrap; }
.view-toggle button + button { border-left: 1.5px solid var(--line); }
.view-toggle button:hover { background: #f8fafc; color: var(--ink); }
.view-toggle button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.modal-list { overflow-y: auto; padding: 10px; display: grid; gap: 8px; }
.modal-empty { padding: 28px 12px; text-align: center; color: var(--muted); font-size: 0.9rem; }
.rec {
  display: block; width: 100%; text-align: left; font: inherit; color: var(--ink);
  padding: 11px 12px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); cursor: pointer;
}
.rec:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.rec.current { border-color: #f59e0b; background: var(--edit-soft); }
.rec-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.rec-date { font-weight: 800; color: var(--ink-strong); font-size: 0.92rem; }
.rec-loc { font-size: 0.75rem; color: var(--muted); text-align: right; }
.rec-who { font-size: 0.8rem; font-weight: 700; color: var(--accent); margin: 2px 0 3px; }
.rec-body { font-size: 0.8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 이름별 명단 */
.person { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); }
.person[open] { border-color: var(--accent-line); }
.person summary { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px; cursor: pointer; list-style: none; }
.person summary::-webkit-details-marker { display: none; }
.person summary::before { content: '▸'; color: #94a3b8; font-size: 0.8rem; width: 10px; }
.person[open] summary::before { content: '▾'; }
.p-name { font-weight: 800; color: var(--ink-strong); flex: 1; }
.p-count { font-size: 0.78rem; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 9px; }
.p-last { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.person-recs { display: grid; gap: 6px; padding: 0 10px 10px; }
.person-recs .rec { padding: 8px 10px; }
.list-actions { display: flex; justify-content: flex-end; gap: 6px; }

/* 기록 상세 보기 */
.detail { padding: 4px 6px 8px; }
.detail-nav { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.detail-when { font-size: 1.05rem; font-weight: 800; color: var(--ink-strong); margin-bottom: 10px; }
.detail-grid { margin: 0 0 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 16px; }
.detail-grid dt { font-size: 0.75rem; font-weight: 800; color: var(--muted); }
.detail-grid dd { margin: 1px 0 0; font-size: 0.92rem; color: var(--ink); }
.detail section { border-top: 1px solid var(--line-soft); padding-top: 10px; margin-top: 10px; }
.detail h4 { margin: 0 0 4px; font-size: 0.8rem; font-weight: 800; color: #334155; }
.detail p { margin: 0; white-space: pre-wrap; font-size: 0.92rem; line-height: 1.7; }

/* 이름 자동완성 (흰 바탕, 검은 글씨) */
.ac-wrap { position: relative; }
.suggest {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 60;
  background: #fff; color: var(--ink-strong); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 28px rgb(15 23 42 / 0.14); max-height: 280px; overflow-y: auto; padding: 4px;
}
.suggest button {
  display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 7px;
  background: transparent; color: var(--ink-strong); font: inherit; font-size: 0.92rem; cursor: pointer;
}
.suggest button.active, .suggest button:hover { background: var(--accent-soft); }

/* 연결 점검 */
.diag { margin: 0; font-size: 0.82rem; line-height: 1.6; padding: 4px 6px; }
.diag dt { font-weight: 800; color: var(--muted); margin-top: 8px; }
.diag dd { margin: 2px 0 0; white-space: pre-wrap; word-break: break-all; }
.diag .bad { color: var(--danger); font-weight: 700; }
.diag .good { color: var(--ok); font-weight: 700; }


/* 알림 */
#toast {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 3000;
  min-width: 260px; max-width: calc(100% - 24px); padding: 11px 18px; border-radius: 10px;
  color: #fff; font-weight: 700; text-align: center; font-size: 0.92rem;
  box-shadow: 0 10px 20px rgb(15 23 42 / 0.2);
}
#toast.ok { background: var(--ok); }
#toast.error { background: var(--danger); }
#toast.info { background: #fff; color: var(--ink-strong); border: 1px solid var(--line); }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } * { transition: none !important; } }

@media (max-width: 680px) {
  form { grid-template-columns: 1fr; padding: 16px 14px; }
  .c2, .c3, .c4 { grid-column: 1 / -1; }
  .actions { width: 100%; }
  .range { flex-wrap: wrap; }
  .view-toggle { width: 100%; margin-left: 0; }
  .view-toggle button { flex: 1; }
}
</style>
</head>
<body>

<div id="toast" role="status" aria-live="polite" hidden></div>

<!-- 기록 목록 모달 (이름 검색 / 심방 기록 조회 / 연결 점검 공용) -->
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div>
        <h3 id="modal-title">심방 기록</h3>
        <p id="modal-sub"></p>
      </div>
      <button type="button" class="icon-btn" onclick="closeModal()" aria-label="닫기">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="range-bar" class="range" hidden>
      <label for="range-year">연도</label>
      <select id="range-year" class="field"></select>
      <div class="view-toggle" role="group" aria-label="조회 방식">
        <button type="button" id="view-date" aria-pressed="false" onclick="runRange('date')" title="최신 날짜순으로 조회">Date</button>
        <button type="button" id="view-name" aria-pressed="false" onclick="runRange('name')" title="이름별 명단으로 조회">Name</button>
      </div>
    </div>
    <div id="modal-list" class="modal-list"></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <h1>교인 심방 기록</h1>
      <p>시카고 언약장로교회 | Chicago Covenant Presbyterian Church</p>
    </div>
    <button type="button" class="chip" onclick="runDiagnosis()" title="심방 기록 시트 연결 상태 확인">연결 점검</button>
  </header>

  <main class="card">
    <div class="toolbar">
      <div class="search">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <div class="ac-wrap" style="flex:1">
          <input type="text" id="search-name" class="field" placeholder="심방 대상자 이름으로 검색" autocomplete="off" role="combobox" aria-expanded="false">
          <div class="suggest" role="listbox" hidden></div>
        </div>
        <button type="button" id="search-btn" class="btn btn-ghost" onclick="searchByName()">검색</button>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" onclick="openRange()">심방 기록 조회</button>
        <button type="button" class="btn btn-danger" onclick="resetAll()">초기화</button>
        <button type="button" id="save-btn" class="btn btn-primary" onclick="save()">기록 저장</button>
      </div>
    </div>

    <div id="found" class="found" hidden aria-live="polite"></div>


    <form id="visit-form" novalidate autocomplete="off">
      <div class="c3">
        <label class="lbl" for="visitDate">심방날짜<span class="req">*</span></label>
        <input type="date" id="visitDate" class="field" required>
      </div>

      <div class="c3">
        <label class="lbl" for="startTime">심방시간<span class="req">*</span></label>
        <div class="time-row">
          <input type="time" id="startTime" class="field" required aria-label="시작시간">
          <span>~</span>
          <input type="time" id="endTime" class="field" required aria-label="종료시간">
        </div>
      </div>

      <div class="c2">
        <label class="lbl" for="targetName">심방 대상자<span class="req">*</span></label>
        <div class="ac-wrap">
          <input type="text" id="targetName" class="field" required placeholder="예: 000 집사" autocomplete="off" role="combobox" aria-expanded="false">
          <div class="suggest" role="listbox" hidden></div>
        </div>
      </div>

      <div class="c2">
        <label class="lbl" for="requestor">심방 요청자</label>
        <input type="text" id="requestor" class="field" placeholder="요청한 분">
      </div>

      <div class="c2">
        <label class="lbl" for="visitorList">심방 참가자<span class="req">*</span></label>
        <input type="text" id="visitorList" class="field" required placeholder="함께 간 분들">
      </div>

      <div class="c2">
        <label class="lbl" for="reason">사유 / 목적</label>
        <input type="text" id="reason" class="field" list="reason-list" placeholder="예: 병문안, 새가족">
        <datalist id="reason-list">
          <option value="정기 심방"><option value="새가족"><option value="병문안">
          <option value="이사 심방"><option value="개업 심방"><option value="조문"><option value="상담">
        </datalist>
      </div>

      <div class="c4">
        <label class="lbl" for="location">심방 장소</label>
        <input type="text" id="location" class="field" placeholder="심방 장소">
      </div>

      <div class="full">
        <label class="lbl" for="details">상세내용<span class="req">*</span></label>
        <textarea id="details" rows="4" class="field" required placeholder="심방 대화 기록과 기도제목"></textarea>
      </div>

      <div class="full">
        <label class="lbl" for="followUp">향후관리 / 계획</label>
        <textarea id="followUp" rows="3" class="field" placeholder="추후 관리할 내용"></textarea>
      </div>
    </form>
  </main>
</div>

<script>
// ───────── 설정 ─────────
const VISIT_API = "https://script.google.com/macros/s/AKfycbxa3gpajiCSgzHk_-wv8vkYpzqWn9ZkmN57U4t4m_J1q52fsz1KVlQU0w2hCMJOFA_1HQ/exec";
const FIELDS = ['visitDate', 'startTime', 'endTime', 'targetName', 'visitorList', 'requestor', 'reason', 'location', 'details', 'followUp'];
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

const state = {
  found: null,          // { name, records, loading, error }
  editing: null,        // 수정 중인 기록. 새 기록이면 null
  dirty: false,
  saving: false,
  modalRecords: [],     // 모달 목록의 기록 (클릭 시 index로 찾음)
  range: { year: '', records: [], view: '' },
  years: [],
  names: [],
  detail: null,
  listBack: null
};

const $ = id => document.getElementById(id);

// ───────── 유틸 ─────────
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pad(n) { return String(n).padStart(2, '0'); }
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function weekday(ds) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ds || '');
  return m ? WEEKDAYS[new Date(+m[1], +m[2] - 1, +m[3]).getDay()] : '';
}
function fmtVisit(r) {
  const wd = weekday(r.visitDate);
  return `${r.visitDate}${wd ? ` (${wd})` : ''}${r.startTime ? ` ${r.startTime}` : ''}`;
}
function sortRecords(list) {
  return list.slice().sort((a, b) =>
    `${b.visitDate || ''} ${b.startTime || ''}`.localeCompare(`${a.visitDate || ''} ${a.startTime || ''}`));
}

// "000 집사", "000 집사 가정", "김OO 권사, 000 집사" → 사람별 이름 (직분·괄호 메모·공백 제거)
const TITLE_RE = /(안수집사|시무장로|은퇴장로|원로장로|협동장로|은퇴권사|명예권사|전도사|집사님|권사님|장로님|목사님|집사|권사|장로|목사|사모|성도|권찰|청년|형제|자매|교우|가정|댁|님)+$/;
function personNames(text) {
  return String(text || '')
    .replace(/\([^)]*\)|\[[^\]]*\]/g, ' ')
    .split(/[,，/·&+\n]|\s및\s|\s와\s|\s과\s/)
    .map(p => p.replace(/\s+/g, '').replace(TITLE_RE, ''))
    .filter(Boolean);
}

let toastTimer;
function toast(text, type = 'ok', ms = 3000) {
  const t = $('toast');
  t.textContent = text;
  t.className = type;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

function confirmDiscard() {
  return !state.dirty || confirm('작성 중인 내용이 저장되지 않았습니다. 버리고 계속할까요?');
}

// ───────── 서버 호출 ─────────
async function visitApi(params, timeoutMs = 25000) {
  const qs = new URLSearchParams({ ...params, t: Date.now() });
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  let data;
  try {
    const res = await fetch(`${VISIT_API}?${qs}`, { signal: ctrl.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('서버 응답이 없습니다. 잠시 후 다시 시도하세요.');
    if (e instanceof SyntaxError) throw new Error('서버가 JSON이 아닌 응답을 보냈습니다. Apps Script 배포 권한(모든 사용자)과 코드 오류를 확인하세요.');
    throw new Error(`서버에 연결하지 못했습니다 (${e.message}).`);
  } finally {
    clearTimeout(timer);
  }
  if (Array.isArray(data)) {
    throw new Error('Apps Script가 아직 이전 버전으로 배포되어 있습니다. 배포 관리 > 수정 > 새 버전으로 다시 배포하세요.');
  }
  if (!data || !data.success) throw new Error((data && data.message) || '알 수 없는 오류');
  return data;
}

// 이름 자동완성 목록과 연도 목록
async function loadNames() {
  try {
    const d = await visitApi({ action: 'names' });
    state.names = d.names || [];
    state.years = d.years || [];
    fillYears();
  } catch (e) {
    console.warn('이름 목록을 불러오지 못했습니다:', e.message);
  }
}

function fillYears() {
  const sel = $('range-year');
  const current = sel.value;
  const thisYear = String(new Date().getFullYear());
  const years = [...new Set([thisYear, ...state.years])].sort().reverse();
  sel.innerHTML = years.map(y => `<option value="${y}">${y}년</option>`).join('');
  sel.value = years.includes(current) ? current : thisYear;
}

// ───────── 이름 자동완성 ─────────
function attachSuggest(input, onPick) {
  const box = input.parentElement.querySelector('.suggest');
  let items = [];
  let active = -1;

  const hide = () => { box.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; };
  const highlight = i => {
    active = i;
    [...box.children].forEach((el, k) => el.classList.toggle('active', k === i));
    if (box.children[i]) box.children[i].scrollIntoView({ block: 'nearest' });
  };
  const pick = name => { input.value = name; hide(); onPick(name); };

  input.addEventListener('input', () => {
    const q = (personNames(input.value)[0] || input.value.trim()).replace(/\s+/g, '');
    if (!q) return hide();
    items = state.names.filter(n => n.includes(q)).slice(0, 8);
    if (!items.length || (items.length === 1 && items[0] === q)) return hide();
    box.innerHTML = items.map(n => `<button type="button" role="option">${esc(n)}</button>`).join('');
    box.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    active = -1;
  });
  input.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229 || box.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight((active + 1) % items.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight((active - 1 + items.length) % items.length); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); e.stopImmediatePropagation(); pick(items[active]); }
    else if (e.key === 'Escape') { hide(); }
  });
  // mousedown에서 처리해야 입력칸 blur보다 먼저 선택됨
  box.addEventListener('mousedown', e => {
    const b = e.target.closest('button');
    if (b) { e.preventDefault(); pick(items[[...box.children].indexOf(b)]); }
  });
  input.addEventListener('blur', () => setTimeout(hide, 120));
}

// ───────── 이름 검색 ─────────
async function searchByName(nameArg, openList = false) {
  const raw = (nameArg ?? $('search-name').value).trim();
  const name = personNames(raw)[0] || raw;
  if (!name) { toast('검색할 이름을 입력하세요.', 'error'); $('search-name').focus(); return; }

  state.found = { name, records: [], loading: true, error: '' };
  renderFound();
  const btn = $('search-btn');
  btn.disabled = true;
  try {
    const d = await visitApi({ action: 'search', name });
    if (state.found?.name !== name) return;   // 그 사이 다른 이름을 검색한 경우
    state.found.records = sortRecords(d.records || []);
  } catch (e) {
    if (state.found?.name === name) state.found.error = e.message;
  } finally {
    if (state.found?.name === name) state.found.loading = false;
    btn.disabled = false;
    renderFound();
  }
  if ((!nameArg || openList) && state.found?.records.length) openFoundList();
}

function renderFound() {
  const box = $('found');
  const f = state.found;
  if (!f) { box.hidden = true; return; }
  let html;
  if (f.loading) {
    html = `<div><strong>${esc(f.name)}</strong> <span class="muted"><span class="spinner"></span> 기록 찾는 중</span></div>`;
  } else if (f.error) {
    html = `<div><strong>${esc(f.name)}</strong> <span class="err">조회 오류: ${esc(f.error)}</span></div>
      <div class="found-actions"><button type="button" class="btn btn-ghost btn-small" onclick="runDiagnosis()">연결 점검</button></div>`;
  } else if (f.records.length) {
    const last = f.records[0];
    html = `<div><strong>${esc(f.name)}</strong> <span class="muted">심방 ${f.records.length}회, 최근 ${esc(last.visitDate)}</span></div>
      <div class="found-actions">
        <button type="button" class="btn btn-ghost btn-small" onclick="openFoundList()">기록 보기</button>
        <button type="button" class="btn btn-primary btn-small" onclick="newForFound()">새 기록 작성</button>
      </div>`;
  } else {
    html = `<div><strong>${esc(f.name)}</strong> <span class="muted">심방 기록이 없습니다.</span></div>
      <div class="found-actions"><button type="button" class="btn btn-primary btn-small" onclick="newForFound()">새 기록 작성</button></div>`;
  }
  box.innerHTML = html;
  box.hidden = false;
}

function openFoundList() {
  const f = state.found;
  if (!f || !f.records.length) return;
  $('modal-title').textContent = `${f.name} 님 심방 기록`;
  $('modal-sub').textContent = `총 ${f.records.length}회, 최신 날짜순`;
  $('range-bar').hidden = true;
  state.listBack = () => renderRecordList(f.records, false);
  state.listBack();
  openModal();
}

// 검색한 분의 새 기록: 대상자 칸에 마지막 기록의 표기("000 집사")를 그대로 사용
function newForFound() {
  const f = state.found;
  if (!f) return;
  if (state.editing && !confirmDiscard()) return;
  if (state.editing) startNew();
  const lastTarget = f.records[0] && personNames(f.records[0].targetName).length === 1 ? f.records[0].targetName : f.name;
  $('targetName').value = lastTarget;
  state.dirty = true;
  renderModeBar();
  $('visitorList').focus();
}

// ───────── 작성 / 수정 상태 ─────────
// 상태줄 없이 저장 버튼 글자로만 구분
function renderModeBar() {
  $('save-btn').textContent = state.editing ? '변경 사항 저장' : '기록 저장';
}

function startNew() {
  $('visit-form').reset();
  $('visitDate').value = today();
  state.editing = null;
  state.dirty = false;
  renderModeBar();
}

function resetAll() {
  if (!confirmDiscard()) return;
  state.found = null;
  $('search-name').value = '';
  renderFound();
  startNew();
  $('search-name').focus();
}

// 목록에서 기록을 누르면 상세 내용만 보여 줌
function showDetail(rec) {
  state.detail = rec;
  const wd = weekday(rec.visitDate);
  const when = `${rec.visitDate}${wd ? ` (${wd})` : ''}${rec.startTime ? `  ${rec.startTime}${rec.endTime ? ` ~ ${rec.endTime}` : ''}` : ''}`;
  const row = (label, v) => `<div><dt>${label}</dt><dd>${esc(v || '-')}</dd></div>`;
  $('modal-list').innerHTML = `<div class="detail">
    <div class="detail-nav">
      <button type="button" class="btn btn-ghost btn-small" data-act="back">← 목록으로</button>
      <button type="button" class="btn btn-ghost btn-small" data-act="edit">이 기록 수정</button>
    </div>
    <div class="detail-when">${esc(when)}</div>
    <dl class="detail-grid">
      ${row('심방 대상자', rec.targetName)}
      ${row('심방 요청자', rec.requestor)}
      ${row('심방 참가자', rec.visitorList)}
      ${row('사유 / 목적', rec.reason)}
      ${row('심방 장소', rec.location)}
    </dl>
    <section><h4>상세내용</h4><p>${esc(rec.details || '-')}</p></section>
    <section><h4>향후관리 / 계획</h4><p>${esc(rec.followUp || '-')}</p></section>
  </div>`;
  $('modal-list').scrollTop = 0;
}

function backToList() {
  state.detail = null;
  if (typeof state.listBack === 'function') state.listBack();
}

function loadRecord(rec) {
  if (state.editing && state.editing.id === rec.id) { closeModal(); return; }
  if (!confirmDiscard()) return;
  FIELDS.forEach(k => { $(k).value = rec[k] || ''; });
  state.editing = rec;
  state.dirty = false;
  closeModal();
  renderModeBar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ───────── 모달 ─────────
function recButton(r, i, showWho) {
  const current = state.editing && state.editing.id === r.id ? ' current' : '';
  const who = showWho ? `${esc(r.targetName)} | ` : '';
  return `<button type="button" class="rec${current}" data-i="${i}">
    <div class="rec-top"><span class="rec-date">${esc(fmtVisit(r))}</span><span class="rec-loc">${esc(r.location || '장소 미기재')}</span></div>
    <div class="rec-who">${who}사유: ${esc(r.reason || '일반')}${r.visitorList ? ` | 참가: ${esc(r.visitorList)}` : ''}</div>
    <div class="rec-body">${esc(r.details)}</div>
  </button>`;
}

function renderRecordList(records, showWho) {
  state.modalRecords = records;
  $('modal-list').innerHTML = records.length
    ? records.map((r, i) => recButton(r, i, showWho)).join('')
    : '<div class="modal-empty">심방 기록이 없습니다.</div>';
}

function openModal() {
  $('modal').hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  $('modal').hidden = true;
  document.body.style.overflow = '';
}

// ───────── 심방 기록 조회 (연도별) ─────────
function openRange() {
  fillYears();
  $('modal-title').textContent = '심방 기록 조회';
  $('modal-sub').textContent = '연도를 고른 뒤 Date(최신 날짜순) 또는 Name(이름별 명단)을 누르세요';
  $('range-bar').hidden = false;
  setViewButtons('');
  state.range = { year: '', records: [], view: '' };
  $('modal-list').innerHTML = '<div class="modal-empty">연도를 고른 뒤 Date 또는 Name을 누르면 조회합니다.</div>';
  openModal();
}

function setViewButtons(view) {
  $('view-date').setAttribute('aria-pressed', String(view === 'date'));
  $('view-name').setAttribute('aria-pressed', String(view === 'name'));
}

async function runRange(view) {
  const year = $('range-year').value;
  setViewButtons(view);
  state.range.view = view;
  $('view-date').disabled = $('view-name').disabled = true;
  $('modal-list').innerHTML = `<div class="modal-empty"><span class="spinner"></span> ${esc(year)}년 기록 조회 중</div>`;
  try {
    const d = await visitApi({ action: 'list', year });
    state.range.year = year;
    state.range.records = sortRecords(d.records || []);
    state.listBack = renderRange;
    renderRange();
  } catch (e) {
    $('modal-list').innerHTML = `<div class="modal-empty">기록을 불러오지 못했습니다: ${esc(e.message)}</div>`;
  } finally {
    $('view-date').disabled = $('view-name').disabled = false;
  }
}

// 기록을 사람별로 묶음 (직분을 뗀 이름 기준)
function groupByPerson(records) {
  const groups = new Map();
  records.forEach((r, i) => {
    const names = personNames(r.targetName);
    const label = names.join(', ') || r.targetName || '(이름 없음)';
    if (!groups.has(label)) groups.set(label, { label, items: [] });
    groups.get(label).items.push(i);
  });
  return [...groups.values()].sort((a, b) => a.label.localeCompare(b.label, 'ko'));
}

function renderRange() {
  const { year, records, view } = state.range;
  const people = groupByPerson(records);
  $('modal-sub').textContent = `${year}년: ${people.length}명, 심방 ${records.length}회${records.length >= 500 ? ' (최근 500건까지 표시)' : ''}`;
  if (!records.length) {
    $('modal-list').innerHTML = `<div class="modal-empty">${esc(year)}년에는 심방 기록이 없습니다.</div>`;
    return;
  }
  state.modalRecords = records;
  const copyBtn = `<div class="list-actions">
    <button type="button" class="btn btn-ghost btn-small" onclick="copyList()">목록 복사</button>
  </div>`;

  if (view === 'date') {
    $('modal-list').innerHTML = copyBtn + records.map((r, i) => recButton(r, i, true)).join('');
    return;
  }
  $('modal-list').innerHTML = copyBtn + people.map(g => `<details class="person">
      <summary><span class="p-name">${esc(g.label)}</span>
        <span class="p-count">${g.items.length}회</span><span class="p-last">${esc(records[g.items[0]].visitDate)}</span></summary>
      <div class="person-recs">${g.items.map(i => recButton(records[i], i, false)).join('')}</div>
    </details>`).join('');
}

function listText() {
  const { year, records, view } = state.range;
  let text;
  if (view === 'date') {
    text = `${year}년 심방 기록 (${records.length}회)\n` +
      records.map(r => `${fmtVisit(r)}  ${r.targetName}${r.reason ? `  [${r.reason}]` : ''}`).join('\n');
  } else {
    const people = groupByPerson(records);
    text = `${year}년 심방 명단 (${people.length}명, ${records.length}회)\n` +
      people.map(g => `${g.label}: ${g.items.length}회 [${g.items.map(i => records[i].visitDate).reverse().join(', ')}]`).join('\n');
  }
  return text;
}

async function copyList() {
  const text = listText();
  try {
    await navigator.clipboard.writeText(text);
    toast('목록을 복사했습니다.');
  } catch (e) {
    toast('복사하지 못했습니다. 브라우저 권한을 확인하세요.', 'error');
  }
}

// ───────── 연결 점검 ─────────
async function runDiagnosis() {
  $('modal-title').textContent = '연결 점검';
  $('modal-sub').textContent = '심방 기록 시트를 어떻게 읽고 있는지 확인합니다';
  $('range-bar').hidden = true;
  $('modal-list').innerHTML = '<div class="modal-empty"><span class="spinner"></span> 확인 중</div>';
  openModal();

  let html = '<dl class="diag">';
  try {
    const d = await visitApi({ action: 'diag' });
    html += `<dt>심방 기록 서버</dt><dd><span class="good">연결됨</span> (버전 ${esc(d.version)})</dd>`;
    html += `<dt>사용 중인 시트</dt><dd>${esc(d.sheet)} (전체 시트: ${esc((d.sheets || []).join(', '))})</dd>`;
    html += `<dt>1행 헤더</dt><dd>${esc((d.headers || []).join(' | '))}</dd>`;
    html += `<dt>열 연결</dt><dd>${esc((d.columns || []).join('\n'))}</dd>`;
    if (d.notify) {
      const when = [d.notify.onCreate && '새 기록 저장', d.notify.onUpdate && '기록 수정'].filter(Boolean).join(', ');
      html += `<dt>저장 시 자동 이메일</dt><dd>${d.notify.to
        ? `<span class="good">${esc(d.notify.to)}</span> (${esc(when || '보내지 않음')})`
        : '<span class="bad">받는 사람이 설정되지 않음</span>'}</dd>`;
    }
    html += `<dt>읽은 기록</dt><dd>${d.count ? `<span class="good">${d.count}건</span>` : '<span class="bad">0건</span>'}</dd>`;
    if (d.samples && d.samples.length) {
      html += `<dt>시트 맨 위 기록 (날짜 | 시간 | 대상자 | 이름 인식)</dt><dd>${esc(d.samples.join('\n'))}</dd>`;
    }
  } catch (e) {
    html += `<dt>심방 기록 서버</dt><dd class="bad">${esc(e.message)}</dd>`;
  }
  html += '</dl>';
  $('modal-list').innerHTML = html;
}

// ───────── 저장 ─────────
function validate() {
  const required = [
    ['visitDate', '심방날짜'], ['startTime', '시작시간'], ['endTime', '종료시간'],
    ['targetName', '심방 대상자'], ['visitorList', '심방 참가자'], ['details', '상세내용']
  ];
  for (const [id, label] of required) {
    if (!$(id).value.trim()) {
      toast(`${label}을(를) 입력하세요.`, 'error');
      $(id).focus();
      return false;
    }
  }
  if ($('endTime').value <= $('startTime').value) {
    toast('종료시간이 시작시간보다 늦어야 합니다.', 'error');
    $('endTime').focus();
    return false;
  }
  return true;
}

async function save() {
  if (state.saving || !validate()) return;
  if (state.editing && !state.dirty) return toast('바뀐 내용이 없습니다.', 'info');

  state.saving = true;
  const btn = $('save-btn');
  const isUpdate = !!state.editing;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>저장 중';

  const payload = {
    action: isUpdate ? 'update' : 'create',
    id: isUpdate ? state.editing.id : '',
    expectedUpdatedAt: isUpdate ? state.editing.updatedAt || '' : ''
  };
  FIELDS.forEach(k => { payload[k] = $(k).value.trim(); });

  try {
    // text/plain으로 보내면 CORS preflight 없이 응답을 읽을 수 있음
    const res = await fetch(VISIT_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message || '알 수 없는 오류');

    state.dirty = false;
    toast(isUpdate ? '변경 사항을 저장했습니다.' : '심방 기록을 저장했습니다.');
    if (data.mailError) console.warn('자동 이메일 발송 실패:', data.mailError);   // 화면에는 표시하지 않음
    if (isUpdate) state.editing = data.record;
    else startNew();
    // 검색 결과와 이름 목록 새로 고침
    if (state.found) searchByName(state.found.name);
    loadNames();
  } catch (e) {
    toast(`저장하지 못했습니다: ${e.message}`, 'error', 6000);
  } finally {
    state.saving = false;
    btn.disabled = false;
    renderModeBar();
  }
}

// ───────── 이벤트 연결 ─────────
window.addEventListener('DOMContentLoaded', () => {
  startNew();
  fillYears();
  loadNames();

  attachSuggest($('search-name'), name => searchByName(name, true));
  attachSuggest($('targetName'), () => { state.dirty = true; });
  $('search-name').addEventListener('focus', e => e.target.select());
  $('search-name').addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 중에는 무시
    if (e.key === 'Enter') { e.preventDefault(); searchByName(); }
  });

  $('modal-list').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act && act.dataset.act === 'back') return backToList();
    if (act && act.dataset.act === 'edit') return loadRecord(state.detail);
    const item = e.target.closest('.rec');
    if (item) showDetail(state.modalRecords[+item.dataset.i]);
  });
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

  $('visit-form').addEventListener('input', () => { state.dirty = true; });
  $('visit-form').addEventListener('submit', e => e.preventDefault());

  window.addEventListener('beforeunload', e => {
    if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
});
</script>
