<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCPC 교인 심방 일지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --ink: #1e293b;
  --ink-strong: #0f172a;
  --muted: #64748b;
  --line: #cbd5e1;
  --line-soft: #e2e8f0;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: #eef2ff;
  --accent-line: #c7d2fe;
  --edit: #92400e;
  --edit-soft: #fffbeb;
  --edit-line: #fcd34d;
  --danger: #dc2626;
  --danger-line: #fca5a5;
  --ok: #059669;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 16px 12px 56px; }

/* 헤더 */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink-strong); }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; font-weight: 500; }
.sync {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 0.75rem; font-weight: 700;
  padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--line-soft); background: var(--surface); color: var(--muted);
  cursor: default;
}
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; }
.sync.online .dot { background: var(--ok); }
.sync.offline { color: var(--danger); border-color: var(--danger-line); cursor: pointer; }
.sync.offline .dot { background: var(--danger); }
.sync.loading { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.sync.loading .dot { background: var(--accent); }
/* 글씨가 왼쪽에서 오른쪽으로 흘러가는 애니메이션 */
.sync-track { position: relative; display: inline-block; overflow: hidden; vertical-align: bottom; }
.sync.loading .sync-track { width: 150px; height: 1.4em; }
.sync.loading #sync-text { position: absolute; left: 0; top: 0; width: 100%; text-align: center; white-space: nowrap; animation: slide-lr 2.4s linear infinite; }
@keyframes slide-lr { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .sync.loading #sync-text { animation: none; } }
.head-tools { display: flex; gap: 6px; align-items: center; }
.diag { margin: 0; font-size: 0.82rem; line-height: 1.6; }
.diag dt { font-weight: 800; color: var(--muted); margin-top: 8px; }
.diag dd { margin: 2px 0 0; white-space: pre-wrap; word-break: break-all; }
.diag .bad { color: var(--danger); font-weight: 700; }
.diag .good { color: var(--ok); font-weight: 700; }
.history-btn.error { background: #fef2f2; border-color: var(--danger-line); color: var(--danger); cursor: pointer; }

/* 카드 */
.card { background: var(--surface); border-radius: 14px; box-shadow: 0 1px 3px rgb(15 23 42 / 0.08); }

/* 공통 입력 */
.field {
  width: 100%; height: 42px; padding: 0 12px;
  font: inherit; font-size: 0.95rem; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 9px;
  transition: border-color .15s, box-shadow .15s;
}
textarea.field { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.6; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgb(79 70 229 / 0.15); }
.field[readonly] { background: #f8fafc; color: var(--ink-strong); font-weight: 700; cursor: default; }

/* 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 42px; padding: 0 16px;
  font: inherit; font-size: 0.9rem; font-weight: 700;
  border-radius: 9px; border: 1.5px solid transparent; cursor: pointer;
  white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:focus-visible, .sync:focus-visible, .icon-btn:focus-visible, .rec:focus-visible, .suggest-item:focus-visible {
  outline: 3px solid var(--accent-line); outline-offset: 2px;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { background: #f8fafc; }
.btn-danger { background: var(--surface); border-color: var(--danger-line); color: var(--danger); }
.btn-small { height: 32px; padding: 0 12px; font-size: 0.8rem; }
.icon-btn { border: 0; background: transparent; padding: 6px; border-radius: 999px; cursor: pointer; color: var(--muted); display: inline-flex; }
.icon-btn:hover { background: var(--line-soft); }

/* 툴바 */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; border-bottom: 1px solid var(--line-soft); }
.search { position: relative; flex: 1 1 280px; }
.search .field { padding-left: 38px; }
.search > svg { position: absolute; left: 12px; top: 13px; width: 16px; height: 16px; color: #94a3b8; pointer-events: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 auto; }
#save-btn { min-width: 128px; }

/* 자동완성 */
.suggest {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 28px rgb(15 23 42 / 0.14);
  max-height: 340px; overflow-y: auto; padding: 4px;
}
.suggest-item {
  display: flex; align-items: baseline; gap: 8px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 7px; background: transparent;
  font: inherit; text-align: left; cursor: pointer; color: var(--ink);
}
.suggest-item.active, .suggest-item:hover { background: var(--accent-soft); }
.suggest-item .nm { font-weight: 800; color: var(--ink-strong); }
.suggest-item .meta { font-size: 0.8rem; color: var(--muted); }
.suggest-item .gone { font-size: 0.72rem; font-weight: 700; color: var(--danger); }
.suggest-item.free .nm { font-weight: 600; color: var(--accent); }
.suggest-empty { padding: 10px; font-size: 0.85rem; color: var(--muted); }

/* 교인 정보 패널 */
.member { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); background: #fafbff; }
.member-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.member-name { font-size: 1.25rem; font-weight: 800; color: var(--ink-strong); letter-spacing: -0.01em; }
.member-name small { font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-left: 6px; }
.member-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; background: #fee2e2; color: var(--danger); vertical-align: 3px; }
.member-facts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 6px; font-size: 0.88rem; }
.member-facts span { color: var(--muted); }
.member-facts b { font-weight: 700; color: var(--ink); }
.member-facts a { color: var(--accent); font-weight: 700; text-decoration: none; }
.history-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 999px;
  font: inherit; font-size: 0.82rem; font-weight: 800;
  background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent);
  cursor: pointer;
}
.history-btn:disabled { cursor: default; background: #f1f5f9; border-color: var(--line-soft); color: var(--muted); }
.member-notes { margin-top: 10px; }
.member-notes summary { font-size: 0.82rem; font-weight: 700; color: var(--accent); cursor: pointer; }
.member-notes dl { margin: 8px 0 0; display: grid; gap: 8px; }
.member-notes dt { font-size: 0.78rem; font-weight: 800; color: var(--muted); }
.member-notes dd { margin: 2px 0 0; white-space: pre-wrap; font-size: 0.88rem; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px 10px; }

/* 작성/수정 상태 표시줄 */
.mode { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; font-size: 0.88rem; border-bottom: 1px solid var(--line-soft); }
.mode.new { background: var(--surface); color: var(--muted); }
.mode.new strong { color: var(--ink-strong); }
.mode.edit { background: var(--edit-soft); border-bottom-color: var(--edit-line); color: var(--edit); border-left: 4px solid #f59e0b; }
.mode.edit strong { color: #78350f; }
.mode .note { display: block; font-size: 0.8rem; margin-top: 2px; }

/* 폼 */
form { padding: 18px 16px 20px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 18px; }
.c2 { grid-column: span 2; }
.c3 { grid-column: span 3; }
.c4 { grid-column: span 4; }
.full { grid-column: 1 / -1; }
.lbl { display: block; font-size: 0.8rem; font-weight: 800; color: #334155; margin-bottom: 5px; }
.lbl .req { color: var(--danger); margin-left: 2px; }
.time-row { display: flex; align-items: center; gap: 8px; }
.time-row span { color: #94a3b8; font-weight: 700; }
.with-btn { display: flex; gap: 8px; }
.hint { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

/* 모달 */
.modal { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgb(15 23 42 / 0.55); }
.modal-box { width: 100%; max-width: 520px; max-height: 84vh; display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 48px rgb(15 23 42 / 0.25); }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); background: #f8fafc; }
.modal-head h3 { margin: 0; font-size: 1rem; font-weight: 800; color: var(--ink-strong); }
.modal-head p { margin: 2px 0 0; font-size: 0.8rem; color: var(--accent); font-weight: 600; }
.range { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.range .field { height: 38px; font-size: 0.88rem; }
.range .btn { height: 38px; }
.modal-list { overflow-y: auto; padding: 10px; display: grid; gap: 8px; }
.modal-empty { padding: 28px 12px; text-align: center; color: var(--muted); font-size: 0.9rem; }
.rec {
  display: block; width: 100%; text-align: left; font: inherit; color: var(--ink);
  padding: 11px 12px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); cursor: pointer;
}
.rec:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.rec.current { border-color: #f59e0b; background: var(--edit-soft); }
.rec-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.rec-date { font-weight: 800; color: var(--ink-strong); font-size: 0.92rem; }
.rec-loc { font-size: 0.75rem; color: var(--muted); text-align: right; }
.rec-who { font-size: 0.8rem; font-weight: 700; color: var(--accent); margin: 2px 0 3px; }
.rec-who .unlinked { color: var(--edit); font-weight: 700; }
.rec-body { font-size: 0.8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 기간별 명단 */
.view-toggle { display: inline-flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; margin-left: auto; }
.view-toggle button { font: inherit; font-size: 0.8rem; font-weight: 700; border: 0; background: var(--surface); color: var(--muted); padding: 0 12px; height: 35px; cursor: pointer; }
.view-toggle button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.person { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); }
.person[open] { border-color: var(--accent-line); }
.person summary { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px; cursor: pointer; list-style: none; }
.person summary::-webkit-details-marker { display: none; }
.person summary::before { content: '▸'; color: #94a3b8; font-size: 0.8rem; width: 10px; }
.person[open] summary::before { content: '▾'; }
.p-name { font-weight: 800; color: var(--ink-strong); }
.p-meta { font-size: 0.78rem; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-count { font-size: 0.78rem; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 9px; }
.p-last { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.person-recs { display: grid; gap: 6px; padding: 0 10px 10px; }
.person-recs .rec { padding: 8px 10px; }
.roster-actions { display: flex; justify-content: flex-end; }

/* 알림 */
#toast {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 3000;
  min-width: 260px; max-width: calc(100% - 24px); padding: 11px 18px; border-radius: 10px;
  color: #fff; font-weight: 700; text-align: center; font-size: 0.92rem;
  box-shadow: 0 10px 20px rgb(15 23 42 / 0.2);
}
#toast.ok { background: var(--ok); }
#toast.error { background: var(--danger); }
#toast.info { background: var(--ink); }

.spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } * { transition: none !important; } }

@media (min-width: 681px) and (max-width: 860px) {
  .with-btn .btn { padding: 0 10px; font-size: 0.8rem; }
}
@media (max-width: 680px) {
  form { grid-template-columns: 1fr; padding: 16px 14px; }
  .c2, .c3, .c4 { grid-column: 1 / -1; }
  .actions { width: 100%; }
  .range { flex-wrap: wrap; }
  .range .field { flex: 1 1 130px; }
}
</style>
</head>
<body>

<div id="toast" role="status" aria-live="polite" hidden></div>

<!-- 기록 목록 모달 (교인별 / 기간별 공용) -->
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div>
        <h3 id="modal-title">심방 기록</h3>
        <p id="modal-sub"></p>
      </div>
      <button type="button" class="icon-btn" onclick="closeModal()" aria-label="닫기">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="range-bar" class="range" hidden>
      <input type="date" id="range-from" class="field" aria-label="시작일">
      <span>~</span>
      <input type="date" id="range-to" class="field" aria-label="종료일">
      <button type="button" id="range-go" class="btn btn-primary" onclick="runRange()">조회</button>
      <div class="view-toggle" role="group" aria-label="보기 방식">
        <button type="button" id="view-roster" aria-pressed="true" onclick="setRangeView('roster')">명단</button>
        <button type="button" id="view-date" aria-pressed="false" onclick="setRangeView('date')">날짜순</button>
      </div>
    </div>
    <div id="modal-list" class="modal-list"></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <h1>교인 심방 기록</h1>
      <p>시카고 언약장로교회 | Chicago Covenant Presbyterian Church</p>
    </div>
    <div class="head-tools">
      <button type="button" id="sync" class="sync loading" onclick="if (this.classList.contains('offline')) loadMembers();">
        <span class="dot"></span><span class="sync-track"><span id="sync-text">교인명부 불러오는 중</span></span>
      </button>
      <button type="button" class="sync" onclick="runDiagnosis()" title="심방 기록 시트 연결 상태 확인">연결 점검</button>
    </div>
  </header>

  <main class="card">
    <div class="toolbar">
      <div class="search">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="member-search" class="field" placeholder="이름, 영문 이름, 교인번호로 검색"
               autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <div id="suggest" class="suggest" role="listbox" hidden></div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" onclick="openRange()">기간별 심방 명단</button>
        <button type="button" class="btn btn-danger" onclick="resetAll()">초기화</button>
        <button type="button" id="save-btn" class="btn btn-primary" onclick="save()">기록 저장</button>
      </div>
    </div>

    <section id="member-panel" class="member" hidden aria-live="polite"></section>

    <div id="mode-bar" class="mode new"></div>

    <form id="visit-form" novalidate autocomplete="off">
      <input type="hidden" id="memberId">

      <div class="c3">
        <label class="lbl" for="visitDate">심방날짜<span class="req">*</span></label>
        <input type="date" id="visitDate" class="field" required>
      </div>

      <div class="c3">
        <label class="lbl" for="startTime">심방시간<span class="req">*</span></label>
        <div class="time-row">
          <input type="time" id="startTime" class="field" required aria-label="시작시간">
          <span>~</span>
          <input type="time" id="endTime" class="field" required aria-label="종료시간">
        </div>
      </div>

      <div class="c2">
        <label class="lbl" for="targetName">심방 대상자<span class="req">*</span></label>
        <input type="text" id="targetName" class="field" readonly placeholder="검색창에서 선택" tabindex="-1">
      </div>

      <div class="c2">
        <label class="lbl" for="requestor">심방 요청자</label>
        <input type="text" id="requestor" class="field" placeholder="요청한 분">
      </div>

      <div class="c2">
        <label class="lbl" for="visitorList">심방 참가자<span class="req">*</span></label>
        <input type="text" id="visitorList" class="field" required placeholder="함께 간 분들">
      </div>

      <div class="c2">
        <label class="lbl" for="reason">사유 / 목적</label>
        <input type="text" id="reason" class="field" list="reason-list" placeholder="예: 병문안, 새가족">
        <datalist id="reason-list">
          <option value="정기 심방"><option value="새가족"><option value="병문안">
          <option value="이사 심방"><option value="개업 심방"><option value="조문"><option value="상담">
        </datalist>
      </div>

      <div class="c4">
        <label class="lbl" for="location">심방 장소</label>
        <div class="with-btn">
          <input type="text" id="location" class="field" placeholder="심방 장소">
          <button type="button" id="use-address" class="btn btn-ghost" onclick="useMemberAddress()" hidden>교인 주소 넣기</button>
        </div>
      </div>

      <div class="full">
        <label class="lbl" for="details">상세내용<span class="req">*</span></label>
        <textarea id="details" rows="4" class="field" required placeholder="심방 대화 기록과 기도제목"></textarea>
      </div>

      <div class="full">
        <label class="lbl" for="followUp">향후관리 / 계획</label>
        <textarea id="followUp" rows="3" class="field" placeholder="추후 관리할 내용"></textarea>
      </div>
    </form>
  </main>
</div>

<script>
// ───────── 설정 ─────────
const VISIT_API  = "https://script.google.com/macros/s/AKfycbxa3gpajiCSgzHk_-wv8vkYpzqWn9ZkmN57U4t4m_J1q52fsz1KVlQU0w2hCMJOFA_1HQ/exec";
const MEMBER_API = "https://script.google.com/macros/s/AKfycbx-N1Y8NaNVu1jiWMxIKQ7xoAQu_65_BKBrT9kZcgiBEN2vsJ52PBTVSVnzkNKQBN0Azw/exec";
const FIELDS = ['visitDate', 'startTime', 'endTime', 'targetName', 'visitorList', 'requestor', 'reason', 'location', 'details', 'followUp'];
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

const state = {
  members: [],
  member: null,        // 선택된 교인 (명부 레코드). 명부에 없는 분이면 null
  history: [],         // 선택된 대상자의 심방 기록
  historyLoading: false,
  historyError: '',
  editing: null,       // 수정 중인 기록. 새 기록이면 null
  dirty: false,
  saving: false,
  suggestions: [],
  suggestIndex: -1,
  modalRecords: [],
  rangeRecords: [],
  rangeView: 'roster'
};

const $ = id => document.getElementById(id);

// ───────── 유틸 ─────────
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pad(n) { return String(n).padStart(2, '0'); }
function dateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function today() { return dateStr(new Date()); }
function monthsAgo(n) { const d = new Date(); d.setMonth(d.getMonth() - n); return dateStr(d); }
function weekday(ds) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ds || '');
  return m ? WEEKDAYS[new Date(+m[1], +m[2] - 1, +m[3]).getDay()] : '';
}
function fmtVisit(r) {
  const wd = weekday(r.visitDate);
  return `${r.visitDate}${wd ? ` (${wd})` : ''}${r.startTime ? ` ${r.startTime}` : ''}`;
}
function sortRecords(list) {
  return list.slice().sort((a, b) =>
    `${b.visitDate || ''} ${b.startTime || ''}`.localeCompare(`${a.visitDate || ''} ${a.startTime || ''}`));
}

// 교인명부의 샘터 값이 날짜로 바뀐 경우(2026-02-22T...) 원래 "2-22" 형식으로 되돌림
function cellGroupText(v) {
  const s = String(v ?? '').trim();
  const m = s.match(/^\d{4}-(\d{2})-(\d{2})T/);
  return m ? `${parseInt(m[1], 10)}-${m[2]}` : s;
}
// "주동린 집사", "주동린 집사 가정", "김OO 권사, 주동린 집사" → 사람별 이름 (직분·공백 제거)
const TITLE_RE = /(안수집사|시무장로|은퇴장로|원로장로|협동장로|은퇴권사|명예권사|전도사|집사님|권사님|장로님|목사님|집사|권사|장로|목사|사모|성도|권찰|청년|형제|자매|교우|가정|댁|님)+$/;
function personNames(text) {
  return String(text || '')
    .split(/[,，/·&+\n]|\s및\s|\s와\s|\s과\s/)
    .map(p => p.replace(/\s+/g, '').replace(TITLE_RE, ''))
    .filter(Boolean);
}
// 3글자 이상 이름은 앞부분 일치, 2글자 이름은 정확히 일치
function nameMatches(targetText, name) {
  const n = String(name || '').replace(/\s+/g, '');
  if (!n) return false;
  return personNames(targetText).some(p => p === n || (n.length >= 3 && p.startsWith(n)));
}
function isTerminated(m) { return !!(String(m.terminationDate || '').trim() || String(m.terminationReason || '').trim()); }
function findMember(id) { return id ? state.members.find(m => String(m.id) === String(id)) || null : null; }

let toastTimer;
function toast(text, type = 'ok', ms = 3000) {
  const t = $('toast');
  t.textContent = text;
  t.className = type;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

async function getJSON(url, timeoutMs = 20000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

// 심방 기록 API 호출. 응답 형식으로 서버 버전 문제를 구분해서 알려 줌
async function visitApi(params) {
  const qs = new URLSearchParams({ ...params, t: Date.now() });
  let data;
  try {
    data = await getJSON(`${VISIT_API}?${qs}`);
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('서버 응답이 없습니다. 잠시 후 다시 시도하세요.');
    if (e instanceof SyntaxError) throw new Error('서버가 JSON이 아닌 응답을 보냈습니다. Apps Script 배포 권한(모든 사용자)과 코드 오류를 확인하세요.');
    throw new Error(`서버에 연결하지 못했습니다 (${e.message}).`);
  }
  if (Array.isArray(data)) {
    throw new Error('Apps Script가 아직 이전 버전으로 배포되어 있습니다. 배포 관리 > 수정 > 새 버전으로 다시 배포하세요.');
  }
  if (!data || !data.success) throw new Error((data && data.message) || '알 수 없는 오류');
  return data;
}

function confirmDiscard() {
  return !state.dirty || confirm('작성 중인 내용이 저장되지 않았습니다. 버리고 계속할까요?');
}

// ───────── 교인명부 ─────────
function setSync(status, text) {
  const el = $('sync');
  el.className = `sync ${status}`;
  $('sync-text').textContent = text;
  el.title = status === 'offline' ? '눌러서 다시 연결' : '';
}

async function loadMembers(retry = 0) {
  setSync('loading', '교인명부 불러오는 중');
  try {
    const data = await getJSON(`${MEMBER_API}?t=${Date.now()}`, 15000);
    state.members = (Array.isArray(data) ? data : []).filter(m => m && String(m.name || '').trim());
    setSync('online', `교인명부 연결됨 (${state.members.length}명)`);
    // 명부가 늦게 도착한 경우, 이미 열어 둔 기록의 교인 정보 채우기
    if (!state.member && $('memberId').value) {
      const m = findMember($('memberId').value);
      if (m) { state.member = m; renderMemberPanel(); }
    }
  } catch (e) {
    if (retry < 2) return setTimeout(() => loadMembers(retry + 1), 1000);
    setSync('offline', '교인명부 연결 실패 (다시 시도)');
    toast('교인명부를 불러오지 못했습니다. 오른쪽 위 버튼을 눌러 다시 시도하세요.', 'error', 5000);
  }
}

// ───────── 검색 / 자동완성 ─────────
function searchMembers(q) {
  // "주동린 집사"처럼 직분을 붙여 입력해도 찾도록
  const query = (/[가-힣]/.test(q) ? (personNames(q)[0] || q.trim()) : q.trim()).toLowerCase();
  if (!query) return [];
  const hits = state.members.filter(m =>
    String(m.name || '').toLowerCase().includes(query) ||
    String(m.engName || '').toLowerCase().includes(query) ||
    String(m.id || '').toLowerCase() === query);
  const rank = m => (String(m.name).toLowerCase() === query || String(m.id).toLowerCase() === query ? 0 : 1) + (isTerminated(m) ? 2 : 0);
  return hits.sort((a, b) => rank(a) - rank(b) || String(a.name).localeCompare(String(b.name), 'ko')).slice(0, 12);
}

function renderSuggest() {
  const box = $('suggest');
  const input = $('member-search');
  const q = input.value.trim();
  if (!q) { hideSuggest(); return; }

  const list = searchMembers(q);
  state.suggestions = list;
  state.suggestIndex = list.length ? 0 : -1;

  let html = list.map((m, i) => {
    const meta = [m.position || '성도', cellGroupText(m.cellGroup) && `샘터 ${cellGroupText(m.cellGroup)}`].filter(Boolean).join(', ');
    return `<button type="button" class="suggest-item${i === 0 ? ' active' : ''}" role="option" data-i="${i}">
      <span class="nm">${esc(m.name)}</span>
      <span class="meta">#${esc(m.id)}${meta ? ` ${esc(meta)}` : ''}</span>
      ${isTerminated(m) ? '<span class="gone">해지</span>' : ''}
    </button>`;
  }).join('');

  if (!state.members.length) {
    html += `<div class="suggest-empty">교인명부가 아직 연결되지 않았습니다.</div>`;
  }
  // 명부에 없는 분(방문자 등)도 기록할 수 있도록
  html += `<button type="button" class="suggest-item free" role="option" data-i="free">
    <span class="nm">명부에 없는 분으로 기록: ${esc(q)}</span></button>`;

  box.innerHTML = html;
  box.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}

function hideSuggest() {
  $('suggest').hidden = true;
  $('member-search').setAttribute('aria-expanded', 'false');
  state.suggestIndex = -1;
}

function moveSuggest(step) {
  const items = [...$('suggest').querySelectorAll('.suggest-item')];
  if (!items.length) return;
  const cur = items.findIndex(el => el.classList.contains('active'));
  const next = (cur + step + items.length) % items.length;
  items.forEach((el, i) => el.classList.toggle('active', i === next));
  items[next].scrollIntoView({ block: 'nearest' });
}

function pickSuggest(el) {
  if (!el) return;
  const i = el.dataset.i;
  const q = $('member-search').value.trim();
  hideSuggest();
  $('member-search').value = '';
  if (i === 'free') selectTarget(null, q);
  else selectTarget(state.suggestions[+i]);
}

// ───────── 대상자 선택 ─────────
function selectTarget(member, freeName = '') {
  const name = member ? String(member.name).trim() : freeName;
  if (!name) return;

  if (state.editing) {
    // 교인번호가 없는 기존 기록을 같은 이름의 교인과 연결하는 경우
    if (member && !state.editing.memberId && nameMatches(state.editing.targetName, name)) {
      state.member = member;
      $('memberId').value = member.id;
      state.dirty = true;
      renderMemberPanel();
      renderModeBar();
      toast(`저장하면 이 기록이 #${member.id} ${name} 교인과 연결됩니다.`, 'info', 4000);
      return;
    }
    if (!confirmDiscard()) return;
    state.member = member;
    startNew();
  } else {
    state.member = member;
  }

  $('targetName').value = name;
  $('memberId').value = member ? member.id : '';
  renderMemberPanel();
  renderModeBar();
  loadHistory();
}

function renderMemberPanel() {
  const panel = $('member-panel');
  const name = $('targetName').value.trim();
  if (!name) { panel.hidden = true; $('use-address').hidden = true; return; }

  const m = state.member;
  let html = '<div class="member-head"><div>';
  if (m) {
    html += `<div class="member-name">${esc(m.name)}<small>#${esc(m.id)}</small>${isTerminated(m) ? '<span class="member-tag">해지</span>' : ''}</div>
      <div class="member-facts">
        <span>직분 <b>${esc(m.position || '성도')}</b></span>
        ${cellGroupText(m.cellGroup) ? `<span>샘터 <b>${esc(cellGroupText(m.cellGroup))}</b></span>` : ''}
        ${m.phone ? `<span>연락처 <a href="tel:${esc(String(m.phone).replace(/[^0-9+]/g, ''))}">${esc(m.phone)}</a></span>` : ''}
        ${m.address ? `<span>주소 <b>${esc(m.address)}</b></span>` : ''}
      </div>`;
  } else {
    html += `<div class="member-name">${esc(name)}<small>교인명부에 연결되지 않음</small></div>`;
  }
  html += '</div>';

  if (state.historyLoading) {
    html += `<button type="button" class="history-btn" disabled><span class="spinner"></span>기록 확인 중</button>`;
  } else if (state.historyError) {
    html += `<button type="button" class="history-btn error" onclick="runDiagnosis()" title="${esc(state.historyError)}">기록 조회 오류 (점검하기)</button>`;
  } else if (state.history.length) {
    html += `<button type="button" class="history-btn" onclick="openHistory()">지난 심방 ${state.history.length}회 보기</button>`;
  } else {
    html += `<button type="button" class="history-btn" disabled>지난 심방 기록 없음</button>`;
  }
  html += '</div>';

  if (m && (String(m.extendedNotes || '').trim() || String(m.notes || '').trim())) {
    html += `<details class="member-notes"><summary>교인명부 메모 보기</summary><dl>
      ${String(m.extendedNotes || '').trim() ? `<div><dt>심방 및 기도 제목</dt><dd>${esc(m.extendedNotes)}</dd></div>` : ''}
      ${String(m.notes || '').trim() ? `<div><dt>가족 관계 및 연락처</dt><dd>${esc(m.notes)}</dd></div>` : ''}
    </dl></details>`;
  }

  panel.innerHTML = html;
  panel.hidden = false;
  $('use-address').hidden = !(m && m.address);
}

function useMemberAddress() {
  if (state.member && state.member.address) {
    $('location').value = state.member.address;
    state.dirty = true;
  }
}

async function loadHistory() {
  const name = $('targetName').value.trim();
  if (!name) return;
  state.historyLoading = true;
  state.historyError = '';
  state.history = [];
  renderMemberPanel();
  try {
    const data = await visitApi({ action: 'search', memberId: $('memberId').value, name });
    // 응답이 늦게 와서 그 사이 다른 대상자를 선택한 경우 무시
    if ($('targetName').value.trim() !== name) return;
    state.history = sortRecords(data.records || []);
  } catch (e) {
    state.historyError = e.message;
    toast(`지난 기록을 불러오지 못했습니다: ${e.message}`, 'error', 6000);
  } finally {
    state.historyLoading = false;
    renderMemberPanel();
  }
}

// ───────── 작성 / 수정 상태 ─────────
function renderModeBar() {
  const bar = $('mode-bar');
  if (state.editing) {
    const r = state.editing;
    const linkNote = !r.memberId
      ? ($('memberId').value
          ? `<span class="note">교인번호가 연결되지 않은 기록입니다. 저장하면 #${esc($('memberId').value)} 교인과 연결됩니다.</span>`
          : `<span class="note">교인번호가 연결되지 않은 기록입니다.</span>`)
      : '';
    bar.className = 'mode edit';
    bar.innerHTML = `<div><strong>${esc(fmtVisit(r))}</strong> 심방 기록을 수정하고 있습니다.${linkNote}</div>
      <button type="button" class="btn btn-ghost btn-small" onclick="newForSameTarget()">새 기록 작성으로 전환</button>`;
    $('save-btn').textContent = '변경 사항 저장';
  } else {
    const name = $('targetName').value.trim();
    bar.className = 'mode new';
    bar.innerHTML = name
      ? `<div><strong>${esc(name)}</strong> 님의 새 심방 기록을 작성하고 있습니다.</div>`
      : `<div>심방 대상자를 검색해서 선택하면 새 기록을 작성할 수 있습니다.</div>`;
    $('save-btn').textContent = '기록 저장';
  }
}

// 대상자는 유지하고 내용만 비움
function startNew() {
  const keepName = $('targetName').value;
  const keepId = $('memberId').value;
  $('visit-form').reset();
  $('targetName').value = keepName;
  $('memberId').value = keepId;
  $('visitDate').value = today();
  state.editing = null;
  state.dirty = false;
  renderModeBar();
}

function newForSameTarget() {
  if (!confirmDiscard()) return;
  if (state.editing && !state.editing.memberId && !state.member) $('memberId').value = '';
  startNew();
}

function resetAll() {
  if (!confirmDiscard()) return;
  state.member = null;
  state.history = [];
  $('targetName').value = '';
  $('memberId').value = '';
  $('member-search').value = '';
  hideSuggest();
  startNew();
  renderMemberPanel();
  $('member-search').focus();
}

function loadRecord(rec) {
  if (state.editing && state.editing.id === rec.id) { closeModal(); return; }
  if (!confirmDiscard()) return;

  FIELDS.forEach(k => { $(k).value = rec[k] || ''; });
  state.editing = rec;

  const linked = findMember(rec.memberId);
  let linkPending = false;
  if (linked) {
    state.member = linked;
    $('memberId').value = linked.id;
  } else if (!rec.memberId && state.member && nameMatches(rec.targetName, state.member.name)) {
    // 교인번호 미연결 기록: 지금 선택된 같은 이름의 교인과 연결 제안 (저장 시 반영)
    $('memberId').value = state.member.id;
    linkPending = true;
  } else {
    if (!rec.memberId || String(state.member?.id) !== String(rec.memberId)) state.member = null;
    $('memberId').value = rec.memberId || '';
  }

  const targetChanged = !state.history.some(h => h.id === rec.id);
  state.dirty = linkPending;   // 교인번호 연결만 해도 저장할 수 있도록
  closeModal();
  renderModeBar();
  renderMemberPanel();
  if (targetChanged) loadHistory();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ───────── 모달 ─────────
function renderRecordList(records, showWho) {
  const list = $('modal-list');
  state.modalRecords = records;
  if (!records.length) {
    list.innerHTML = `<div class="modal-empty">${$('range-bar').hidden ? '심방 기록이 없습니다.' : '이 기간에는 심방 기록이 없습니다. 기간을 넓혀서 다시 조회하세요.'}</div>`;
    return;
  }
  list.innerHTML = records.map((r, i) => recButton(r, i, showWho)).join('');
}

function openModal() {
  $('modal').hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  $('modal').hidden = true;
  document.body.style.overflow = '';
}

function openHistory() {
  if (!state.history.length) return;
  const name = $('targetName').value.trim();
  $('modal-title').textContent = `${name} 님 심방 기록`;
  $('modal-sub').textContent = `총 ${state.history.length}회, 최근 날짜순`;
  $('range-bar').hidden = true;
  renderRecordList(state.history, false);
  openModal();
}

function openRange() {
  $('modal-title').textContent = '기간별 심방 명단';
  $('modal-sub').textContent = '기간을 정하고 조회하세요';
  $('range-bar').hidden = false;
  if (!$('range-from').value) $('range-from').value = monthsAgo(3);
  if (!$('range-to').value) $('range-to').value = today();
  $('modal-list').innerHTML = '';
  openModal();
  runRange();
}

function setRangeView(view) {
  state.rangeView = view;
  $('view-roster').setAttribute('aria-pressed', String(view === 'roster'));
  $('view-date').setAttribute('aria-pressed', String(view === 'date'));
  renderRange();
}

// 기간 내 기록을 사람별로 묶음 (교인번호 우선, 없으면 직분을 뗀 이름)
function groupByPerson(records) {
  const groups = new Map();
  records.forEach((r, i) => {
    const m = findMember(r.memberId);
    const names = personNames(r.targetName);
    const key = r.memberId ? `id:${r.memberId}` : `nm:${names.join(',') || r.targetName}`;
    if (!groups.has(key)) {
      groups.set(key, { label: m ? String(m.name) : (names.join(', ') || r.targetName), member: m, memberId: r.memberId, items: [] });
    }
    groups.get(key).items.push(i);
  });
  return [...groups.values()].sort((a, b) => a.label.localeCompare(b.label, 'ko'));
}

function recButton(r, i, showWho) {
  const m = findMember(r.memberId);
  const who = showWho
    ? `${esc(r.targetName)}${r.memberId ? ` #${esc(r.memberId)}` : ' <span class="unlinked">(교인번호 미연결)</span>'}${m && cellGroupText(m.cellGroup) ? `, 샘터 ${esc(cellGroupText(m.cellGroup))}` : ''} | `
    : (!r.memberId ? '<span class="unlinked">교인번호 미연결</span> | ' : '');
  const current = state.editing && state.editing.id === r.id ? ' current' : '';
  return `<button type="button" class="rec${current}" data-i="${i}">
    <div class="rec-top"><span class="rec-date">${esc(fmtVisit(r))}</span><span class="rec-loc">${esc(r.location || '장소 미기재')}</span></div>
    <div class="rec-who">${who}사유: ${esc(r.reason || '일반')}</div>
    <div class="rec-body">${esc(r.details)}</div>
  </button>`;
}

function renderRange() {
  const records = state.rangeRecords;
  if ($('range-bar').hidden) return;
  if (state.rangeView === 'date' || !records.length) { renderRecordList(records, true); return; }

  state.modalRecords = records;
  const groups = groupByPerson(records);
  $('modal-list').innerHTML = `<div class="roster-actions"><button type="button" class="btn btn-ghost btn-small" onclick="copyRoster()">명단 복사</button></div>` +
    groups.map(g => {
      const m = g.member;
      const meta = m
        ? [m.position || '성도', cellGroupText(m.cellGroup) && `샘터 ${cellGroupText(m.cellGroup)}`].filter(Boolean).join(', ')
        : (g.memberId ? `#${g.memberId}` : '교인번호 미연결');
      const last = records[g.items[0]].visitDate;   // 기록이 최근순이므로 첫 번째가 최근
      return `<details class="person">
        <summary><span class="p-name">${esc(g.label)}</span><span class="p-meta">${esc(meta)}</span>
          <span class="p-count">${g.items.length}회</span><span class="p-last">${esc(last)}</span></summary>
        <div class="person-recs">${g.items.map(i => recButton(records[i], i, false)).join('')}</div>
      </details>`;
    }).join('');
}

async function copyRoster() {
  const groups = groupByPerson(state.rangeRecords);
  const lines = groups.map(g => {
    const m = g.member;
    const extra = m ? [m.position || '성도', cellGroupText(m.cellGroup) && `샘터 ${cellGroupText(m.cellGroup)}`].filter(Boolean).join(', ') : '';
    const dates = g.items.map(i => state.rangeRecords[i].visitDate).reverse().join(', ');
    return `${g.label}${extra ? ` (${extra})` : ''}: ${g.items.length}회 [${dates}]`;
  });
  const text = `심방 명단 ${$('range-from').value} ~ ${$('range-to').value} (${groups.length}명, ${state.rangeRecords.length}회)\n` + lines.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    toast('명단을 복사했습니다.');
  } catch (e) {
    toast('복사하지 못했습니다. 브라우저 권한을 확인하세요.', 'error');
  }
}

async function runRange() {
  const from = $('range-from').value;
  const to = $('range-to').value;
  if (!from || !to) return toast('시작일과 종료일을 모두 선택하세요.', 'error');
  if (from > to) return toast('시작일이 종료일보다 늦습니다.', 'error');

  const btn = $('range-go');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const data = await visitApi({ action: 'list', from, to });
    const records = sortRecords(data.records || []);
    state.rangeRecords = records;
    const people = groupByPerson(records).length;
    $('modal-sub').textContent = `${from} ~ ${to}: ${people}명, 심방 ${records.length}회${records.length >= 500 ? ' (최근 500건까지 표시)' : ''}`;
    renderRange();
  } catch (e) {
    $('modal-list').innerHTML = `<div class="modal-empty">기록을 불러오지 못했습니다: ${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '조회';
  }
}

// ───────── 연결 점검 ─────────
async function runDiagnosis() {
  $('modal-title').textContent = '연결 점검';
  $('modal-sub').textContent = '심방 기록 시트를 어떻게 읽고 있는지 확인합니다';
  $('range-bar').hidden = true;
  $('modal-list').innerHTML = '<div class="modal-empty"><span class="spinner" style="display:inline-block"></span> 확인 중</div>';
  openModal();

  let html = '<dl class="diag">';
  html += `<dt>교인명부</dt><dd>${state.members.length ? `<span class="good">연결됨</span> (${state.members.length}명)` : '<span class="bad">불러오지 못함</span>'}</dd>`;
  try {
    const d = await visitApi({ action: 'diag' });
    html += `<dt>심방 기록 서버</dt><dd><span class="good">연결됨</span> (버전 ${esc(d.version)})</dd>`;
    html += `<dt>사용 중인 시트</dt><dd>${esc(d.sheet)} (전체 시트: ${esc((d.sheets || []).join(', '))})</dd>`;
    html += `<dt>1행 헤더</dt><dd>${esc((d.headers || []).join(' | '))}</dd>`;
    html += `<dt>열 연결</dt><dd>${esc((d.columns || []).join('\n'))}</dd>`;
    html += `<dt>읽은 기록</dt><dd>${d.count ? `<span class="good">${d.count}건</span>` : '<span class="bad">0건</span>'}</dd>`;
    if (d.samples && d.samples.length) {
      html += `<dt>최근 기록 (날짜 | 시간 | 대상자 | 이름 인식)</dt><dd>${esc(d.samples.join('\n'))}</dd>`;
    }
    if ($('targetName').value.trim()) {
      const s = await visitApi({ action: 'search', memberId: $('memberId').value, name: $('targetName').value.trim() });
      html += `<dt>"${esc($('targetName').value.trim())}" 검색 결과</dt><dd>${s.records.length}건</dd>`;
    }
  } catch (e) {
    html += `<dt>심방 기록 서버</dt><dd class="bad">${esc(e.message)}</dd>`;
  }
  html += '</dl>';
  $('modal-list').innerHTML = html;
}

// ───────── 저장 ─────────
function validate() {
  if (!$('targetName').value.trim()) {
    toast('심방 대상자를 검색해서 선택하세요.', 'error');
    $('member-search').focus();
    return false;
  }
  const required = ['visitDate', 'startTime', 'endTime', 'visitorList', 'details'];
  for (const id of required) {
    if (!$(id).value.trim()) {
      const label = document.querySelector(`label[for="${id}"]`)?.firstChild?.textContent?.trim() || '필수 항목';
      toast(`${id === 'endTime' ? '종료시간' : label}을(를) 입력하세요.`, 'error');
      $(id).focus();
      return false;
    }
  }
  if ($('endTime').value <= $('startTime').value) {
    toast('종료시간이 시작시간보다 늦어야 합니다.', 'error');
    $('endTime').focus();
    return false;
  }
  return true;
}

async function save() {
  if (state.saving || !validate()) return;
  if (state.editing && !state.dirty) return toast('바뀐 내용이 없습니다.', 'info');

  state.saving = true;
  const btn = $('save-btn');
  const isUpdate = !!state.editing;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>저장 중';

  const payload = {
    action: isUpdate ? 'update' : 'create',
    id: isUpdate ? state.editing.id : '',
    expectedUpdatedAt: isUpdate ? state.editing.updatedAt || '' : '',
    memberId: $('memberId').value
  };
  FIELDS.forEach(k => { payload[k] = $(k).value.trim(); });

  try {
    // text/plain으로 보내면 CORS preflight 없이 응답을 읽을 수 있음
    const res = await fetch(VISIT_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message || '알 수 없는 오류');

    state.dirty = false;
    if (isUpdate) {
      toast('변경 사항을 저장했습니다.');
      state.editing = data.record;
      renderModeBar();
    } else {
      toast('심방 기록을 저장했습니다.');
      startNew();
    }
    loadHistory();
  } catch (e) {
    toast(`저장하지 못했습니다: ${e.message}`, 'error', 6000);
  } finally {
    state.saving = false;
    btn.disabled = false;
    renderModeBar();
  }
}

// ───────── 이벤트 연결 ─────────
window.addEventListener('DOMContentLoaded', () => {
  $('visitDate').value = today();
  renderModeBar();
  loadMembers();

  const search = $('member-search');
  search.addEventListener('input', renderSuggest);
  search.addEventListener('focus', () => { if (search.value.trim()) renderSuggest(); });
  search.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 중에는 무시
    if ($('suggest').hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSuggest(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSuggest(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); pickSuggest($('suggest').querySelector('.suggest-item.active')); }
    else if (e.key === 'Escape') { hideSuggest(); }
  });

  // mousedown에서 선택해야 input blur보다 먼저 처리됨
  $('suggest').addEventListener('mousedown', e => {
    const item = e.target.closest('.suggest-item');
    if (item) { e.preventDefault(); pickSuggest(item); }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search')) hideSuggest();
  });

  $('modal-list').addEventListener('click', e => {
    const item = e.target.closest('.rec');
    if (item) loadRecord(state.modalRecords[+item.dataset.i]);
  });
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

  $('visit-form').addEventListener('input', () => { state.dirty = true; });
  $('visit-form').addEventListener('submit', e => e.preventDefault());

  window.addEventListener('beforeunload', e => {
    if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
});
</script>
</body>
</html>
