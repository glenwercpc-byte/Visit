<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시카고 언약장로교회 교인 심방 일지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .form-card { background-color: #ffffff; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .input-field { border: 1.5px solid #cbd5e1; border-radius: 0.5rem; padding: 0.5rem 0.75rem; width: 100%; transition: all 0.2s; background-color: #ffffff; }
        .input-field:focus { outline: none; border-color: #6366f1; background-color: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; gap: 0.4rem; transition: all 0.2s; border: 1px solid transparent; }
        .btn-primary { background-color: #6366f1; color: white; }
        .btn-primary:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background-color: #fff; border-color: #94a3b8; color: #334155; }
        .btn-danger { background-color: #fff; border-color: #fca5a5; color: #ef4444; }
        #status-msg { display: none; position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 3000; padding: 0.75rem 1.5rem; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); font-weight: 700; text-align: center; min-width: 250px; }
        
        #visit-count-display { 
            display: none; 
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem; 
            font-weight: 700; 
            color: #4f46e5; 
            background-color: #eef2ff; 
            padding: 0.4rem 0.85rem; 
            border-radius: 9999px; 
            border: 2px solid #6366f1; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        #visit-count-display:hover { background-color: #6366f1; color: white; transform: translateY(-1px); }
        
        .form-label { display: block; font-size: 0.75rem; font-weight: 800; color: #334155; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 0.25rem; }
        
        #history-modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
        .modal-content { background: white; width: 100%; max-width: 450px; border-radius: 1rem; max-height: 80vh; display: flex; flex-direction: column; }

        .spinner {
            animation: rotate 1s linear infinite;
            width: 1rem;
            height: 1rem;
            display: none;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-2 md:p-4">

    <div id="status-msg"></div>

    <!-- 심방 이력 모달 -->
    <div id="history-modal" onclick="closeModal()">
        <div class="modal-content shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div>
                    <h3 id="modal-title" class="font-bold text-slate-800 text-base">심방 기록 선택</h3>
                    <p id="modal-target-info" class="text-xs text-indigo-600 font-semibold">기록을 클릭하면 내용이 교체됩니다.</p>
                </div>
                <button onclick="closeModal()" class="p-1 hover:bg-slate-200 rounded-full text-slate-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
            </div>
            <div id="history-list" class="overflow-y-auto p-3 space-y-2 bg-white"></div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto space-y-3">
        <header>
            <h1 class="text-slate-900 font-extrabold text-2xl tracking-tight">교인 심방 기록 시스템</h1>
            <p class="text-slate-500 text-sm font-medium">시카고 언약장로교회 | Chicago Covenant Presbyterian Church</p>
        </header>

        <main class="form-card overflow-hidden">
            <!-- 조회 툴바 -->
            <div class="p-4 bg-white border-b border-slate-200 flex flex-col lg:flex-row justify-between items-center gap-3">
                <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                    <div class="relative w-full md:w-32">
                        <input type="text" id="search-name" placeholder="성함" class="input-field h-10 pl-9 text-sm">
                        <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <button id="search-btn" onclick="search()" class="btn btn-secondary h-10 px-4 text-sm hover:bg-slate-50 min-w-[80px]">
                        <svg id="search-spinner" class="spinner mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                        </svg>
                        <span id="search-btn-text">조회</span>
                    </button>
                    <div id="visit-count-display" onclick="openHistoryList(false)"></div>
                </div>
                <div class="flex gap-2 w-full lg:w-auto">
                    <button type="button" id="date-view-btn" onclick="fetchByDate()" class="btn btn-secondary h-10 flex-grow lg:px-4 text-sm border-indigo-200 text-indigo-600">일자별 전체 조회</button>
                    <button type="button" onclick="clearFormOnly()" class="btn btn-danger h-10 flex-grow lg:px-4 text-sm">초기화</button>
                    <button type="button" id="save-btn" onclick="save()" class="btn btn-primary h-10 px-6 flex-grow lg:px-8 text-sm shadow-lg shadow-indigo-100">
                        <span id="save-btn-text">기록 저장</span>
                    </button>
                </div>
            </div>

            <!-- 입력 폼 -->
            <form id="visit-form" class="p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                <input type="hidden" id="rowId" value="">
                
                <div class="space-y-1">
                    <label class="form-label">심방날짜 (A)</label>
                    <input type="date" id="visitDate" class="input-field text-base font-semibold" required>
                </div>
                
                <div class="space-y-1">
                    <label class="form-label">심방시간 (B)</label>
                    <div class="flex items-center gap-2">
                        <input type="time" id="startTime" class="input-field font-mono text-sm" required>
                        <span class="text-slate-400 font-bold">~</span>
                        <input type="time" id="endTime" class="input-field font-mono text-sm" required>
                    </div>
                </div>
                
                <div class="space-y-1">
                    <label class="form-label">심방 대상자 (C)</label>
                    <input type="text" id="targetName" class="input-field text-sm" required placeholder="성함 입력">
                </div>
                
                <div class="space-y-1">
                    <label class="form-label">심방 참가자 (D)</label>
                    <input type="text" id="visitorList" class="input-field text-sm" required placeholder="참석자 명단">
                </div>

                <div class="space-y-1">
                    <label class="form-label">요청자 (E)</label>
                    <input type="text" id="requestor" class="input-field text-sm" placeholder="심방 요청자">
                </div>
                
                <div class="space-y-1">
                    <label class="form-label">사유 / 목적 (F)</label>
                    <input type="text" id="reason" class="input-field text-sm" placeholder="심방 사유">
                </div>
                
                <div class="md:col-span-2 space-y-1">
                    <label class="form-label">장소 (G)</label>
                    <input type="text" id="location" class="input-field text-sm" placeholder="심방 장소">
                </div>
                
                <div class="md:col-span-2 space-y-1">
                    <label class="form-label">상세내용 (H)</label>
                    <textarea id="details" rows="6" class="input-field text-sm resize-none" required placeholder="심방 대화 기록 및 기도제목"></textarea>
                </div>
                
                <div class="md:col-span-2 space-y-1">
                    <label class="form-label">향후관리 / 계획 (I)</label>
                    <textarea id="followUp" rows="3" class="input-field text-sm resize-none" placeholder="추후 관리 사항"></textarea>
                </div>
            </form>
        </main>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5upjFVk1wVaVn03frx6EEGyITi7PcvziLOq-XUQ919SbELczF2YKENrYONSjJRXLuNg/exec";
        let currentSearchResults = [];
        let lastSearchQuery = "";

        function showMessage(text, type='success') {
            const m = document.getElementById('status-msg');
            m.innerText = text;
            m.style.display = 'block';
            m.style.backgroundColor = type==='error'?'#ef4444':'#10b981';
            m.style.color = 'white';
            setTimeout(() => { m.style.display = 'none'; }, 3000);
        }

        function clearFormOnly() {
            document.getElementById('visit-form').reset();
            document.getElementById('rowId').value = "";
            document.getElementById('search-name').value = "";
            document.getElementById('visit-count-display').style.display = 'none';
            document.getElementById('save-btn-text').innerText = "기록 저장";
            document.getElementById('visitDate').value = new Date().toLocaleDateString('en-CA');
            currentSearchResults = [];
            lastSearchQuery = "";
        }

        function closeModal() { document.getElementById('history-modal').style.display = 'none'; }

        function fillForm(data) {
            document.getElementById('rowId').value = data.row || '';
            document.getElementById('visitDate').value = data.visitDate || ''; 
            document.getElementById('startTime').value = data.startTime || '';
            document.getElementById('endTime').value = data.endTime || '';
            document.getElementById('targetName').value = data.targetName || '';
            document.getElementById('visitorList').value = data.visitorList || '';
            document.getElementById('requestor').value = data.requestor || '';    
            
            // [데이터 교차 로드] 시트의 '장소' 데이터를 화면의 '사유' 칸에, 시트의 '사유' 데이터를 화면의 '장소' 칸에 표시
            document.getElementById('reason').value = data.location || '';          
            document.getElementById('location').value = data.reason || '';      
            
            document.getElementById('details').value = data.details || '';        
            document.getElementById('followUp').value = data.followUp || '';      
            
            document.getElementById('save-btn-text').innerText = "기존 기록 수정하기";
            closeModal();
        }

        async function search() {
            const name = document.getElementById('search-name').value.trim();
            if(!name) return showMessage("조회할 성함을 입력하세요.", "error");
            
            const btn = document.getElementById('search-btn');
            const spinner = document.getElementById('search-spinner');
            const btnText = document.getElementById('search-btn-text');
            const badge = document.getElementById('visit-count-display');
            
            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.innerText = "조회중";
            badge.style.display = "none";

            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=search&name=${encodeURIComponent(name)}`);
                const results = await res.json();
                
                lastSearchQuery = name;
                currentSearchResults = (results || []).sort((a,b) => b.visitDate.localeCompare(a.visitDate));
                
                if(currentSearchResults.length > 0) {
                    fillForm(currentSearchResults[0]);
                    // [수정] 성함(현종환)을 삭제하고 'X회 기록됨'만 표시
                    badge.innerHTML = `<span>📂 <strong>${currentSearchResults.length}회 기록됨 (목록보기)</strong></span>`;
                    badge.style.display = "flex";
                    showMessage(`'${name}' 성도님의 최근 기록을 불러왔습니다.`);
                } else {
                    showMessage("기록이 존재하지 않습니다.", "error");
                }
            } catch(e) { showMessage("통신 오류", "error"); }
            finally { 
                btn.disabled = false; 
                spinner.style.display = "none";
                btnText.innerText = "조회"; 
            }
        }

        function openHistoryList(viewAllFlag = false) {
            if (currentSearchResults.length === 0) return;
            
            const listContainer = document.getElementById('history-list');
            const modalTitle = document.getElementById('modal-title');
            const targetInfo = document.getElementById('modal-target-info');

            listContainer.innerHTML = '';

            let displayList = [...currentSearchResults];
            if (viewAllFlag) {
                modalTitle.innerText = "일자별 전체 기록";
                targetInfo.innerText = "전체 데이터베이스 조회 결과";
            } else {
                modalTitle.innerText = `'${lastSearchQuery}' 조회 기록`;
                targetInfo.innerText = `총 ${displayList.length}건이 발견되었습니다.`;
            }

            displayList.forEach(item => {
                const card = document.createElement('div');
                card.className = "p-3 border border-slate-200 rounded-lg hover:border-indigo-400 hover:bg-indigo-50 cursor-pointer bg-white shadow-sm transition-all";
                card.onclick = () => {
                    fillForm(item);
                    showMessage(`${item.visitDate} 기록으로 전환되었습니다.`);
                };
                
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-slate-800 text-sm">${item.visitDate}</span>
                        <span class="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-500">${item.targetName}</span>
                    </div>
                    <div class="text-[11px] text-slate-500 line-clamp-2 leading-relaxed">${item.details || '내용 없음'}</div>
                `;
                listContainer.appendChild(card);
            });
            document.getElementById('history-modal').style.display = 'flex';
        }

        async function fetchByDate() {
            const btn = document.getElementById('date-view-btn');
            btn.innerText = "데이터 로딩중...";
            btn.disabled = true;

            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=search&name=`);
                const results = await res.json();
                if (results && results.length > 0) {
                    currentSearchResults = results.sort((a,b) => b.visitDate.localeCompare(a.visitDate));
                    openHistoryList(true);
                } else {
                    showMessage("데이터가 존재하지 않습니다.", "error");
                }
            } catch (e) { showMessage("로드 실패", "error"); }
            finally {
                btn.innerText = "일자별 전체 조회";
                btn.disabled = false;
            }
        }

        async function save() {
            const form = document.getElementById('visit-form');
            if(!form.checkValidity()) return form.reportValidity();
            
            const btn = document.getElementById('save-btn');
            const btnText = document.getElementById('save-btn-text');
            
            btn.disabled = true;
            const originalBtnText = btnText.innerText;
            btnText.innerText = "전송 중...";

            const rowId = document.getElementById('rowId').value;
            
            // [데이터 교차 저장 유지] 
            // 화면의 '사유' 값을 페이로드의 'location'으로, 화면의 '장소' 값을 페이로드의 'reason'으로 보냄
            const payload = {
                action: rowId ? "update" : "save",
                row: rowId,
                visitDate: document.getElementById('visitDate').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                targetName: document.getElementById('targetName').value.trim(),
                requestor: document.getElementById('requestor').value.trim(),     
                visitorList: document.getElementById('visitorList').value.trim(), 
                reason: document.getElementById('location').value.trim(),           // 시트의 Reason(사유) 열에 화면의 '장소'값 저장
                location: document.getElementById('reason').value.trim(),           // 시트의 Location(장소) 열에 화면의 '사유'값 저장
                details: document.getElementById('details').value.trim(),
                followUp: document.getElementById('followUp').value.trim()
            };

            const formData = new URLSearchParams();
            for (const key in payload) { formData.append(key, payload[key]); }

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                
                showMessage("기록이 성공적으로 전송되었습니다.");
                
                setTimeout(() => {
                    clearFormOnly();
                    btn.disabled = false;
                    btnText.innerText = "기록 저장";
                }, 2000);

            } catch(e) { 
                showMessage("오류가 발생했습니다.", "error"); 
                btn.disabled = false;
                btnText.innerText = originalBtnText;
            }
        }

        window.onload = () => { 
            document.getElementById('visitDate').value = new Date().toLocaleDateString('en-CA');
            document.getElementById('search-name').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); search(); }
            });
        };
    </script>
</body>
</html>
